<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maflix</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/addProfile.css">
    <link rel="shortcut icon" href="img/netflixIcon.png" type="image/x-icon">
</head>

<body>
    <header>
        <nav>
            <a href="index.html">
                <img class="logo" src="img/logo.png" alt="Logo">
            </a>
        </nav>
    </header>
    <main>
        <div class="container">
            <h1>Adicionar Perfil</h1>
            <h3>Adicione um perfil Maflix para outra pessoa.</h3>
            <hr>
            <form>
                <div class="form-group">
                    <img src="img/avatar2.png" alt="Avatar">
                    <input type="text" id="name" placeholder="Nome" autocomplete="none">
                    <div class="checkbox">
                        <input type="checkbox" id="crianca">
                        <label for="crianca">Criança?</label>
                    </div>
                </div>
                <hr>
                <div class="buttons">
                    <button onclick="cadastrarUsuario()" type="button" class="btn" id="btnOk">Continuar</button>
                    <a href="index.html" class="btn">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
